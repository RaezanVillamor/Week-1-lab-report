<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 420px;
      max-width: 85%;
      background: #151c26;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid #2ee59d;
      box-shadow: 0 0 30px rgba(46, 229, 157, 0.1);
    }

    h1 {
      margin-bottom: 5px;
      font-size: 40px;
    }

    .green {
      color: #2ee59d;
    }

    p {
      color: #b8c1cc;
      line-height: 1.5;
    }

    .tags {
      margin: 20px 0;
    }

    .tag {
      display: inline-block;
      background: #202a36;
      padding: 6px 10px;
      margin: 4px;
      border-radius: 10px;
      font-size: 12px;
    }

    button {
      background: #2ee59d;
      color: #07100c;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #fact {
      min-height: 40px;
      margin-top: 18px;
      color: white;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Hi, I'm <span class="green">Rae</span></h1>

    <p>
      I'm a Computing Science student at the University of Alberta.
      I'm interested in cybersecurity, psychology, and technology.
    </p>

    <div class="tags">
      <span class="tag">Cybersecurity</span>
      <span class="tag">CTFs</span>
      <span class="tag">Rock Climbing</span>
      <span class="tag">Cycling</span>
      <span class="tag">Cats</span>
    </div>

    <button id="button">Random Fact</button>

    <p id="fact">
      Click the button to learn something about me.
    </p>
  </div>

  <script>
    const facts = [
      "I have two cats named Snufkin and Zoro.",
      "I enjoy rock climbing.",
      "I like cycling.",
      "I compete in cybersecurity CTFs.",
      "Cybersecurity is one of my biggest interests."
    ];

    const button = document.getElementById("button");
    const fact = document.getElementById("fact");

    button.addEventListener("click", function() {
      const random = Math.floor(Math.random() * facts.length);
      fact.textContent = facts[random];
    });
  </script>

</body>
</html>
